# CONY 코니 — Codemagic 클라우드 iOS 빌드 (Windows PC에서 Mac 없이 iOS 앱 만들기)
# 사용법: docs/IOS-BUILD.md 참조. Codemagic 개인 계정 무료 500분/월로 충분 (1회 빌드 약 10~15분).
workflows:
  ios-build:
    name: CONY iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      # Codemagic UI에 등록한 App Store Connect API 키 이름과 한 글자도 다르면 안 된다.
      # 개인 계정은 좌측 Settings(계정 설정) 안의 Integrations에서 등록한다.
      app_store_connect: cony-asc-key
    environment:
      # ★ios_signing 블록은 쓰지 않는다. 그건 "Codemagic에 미리 업로드해둔 프로파일을 가져오는"
      #  수동 서명 방식이라, 프로파일이 없으면
      #  "No matching profiles found for bundle identifier ..." 로 실패한다(첫 빌드가 그랬다).
      #  아래 '코드 서명' 단계에서 --create 로 인증서·프로파일을 없으면 만들어 쓰는 자동 방식을 쓴다.
      #  두 방식을 섞으면 안 된다.
      vars:
        BUNDLE_ID: "com.conyami.app"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: 의존성 설치
        script: npm install
      - name: 웹 자산 빌드 (dist/)
        script: npm run web:build
      - name: iOS 플랫폼 생성
        script: npx cap add ios
      - name: 앱 아이콘·스플래시 생성 (assets/icon.png, splash.png → iOS 전 사이즈)
        # ★ios/ 폴더는 매 빌드마다 새로 만들어지므로, 이 단계가 없으면 Capacitor 기본
        #  플레이스홀더 아이콘이 그대로 앱에 박힌다(애플 심사에서 반려 사유가 된다).
        script: npm run assets:gen
      - name: 웹 자산 동기화
        script: npx cap sync ios
      - name: 코드 서명 (인증서·프로파일이 없으면 생성)
        # --create 가 핵심. App ID를 갓 만들면 배포 인증서도 프로비저닝 프로파일도 없는데,
        # 이 플래그가 App Store Connect API로 둘 다 만들어 준다. keychain 초기화 → 서명 파일
        # 내려받기 → 인증서 등록 → Xcode 프로젝트에 프로파일 적용 순서를 지켜야 한다.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: 빌드 번호 자동 증가
        # Codemagic이 워크플로마다 자동으로 올려주는 $BUILD_NUMBER를 그대로 쓴다.
        # 예전엔 app-store-connect로 최신 번호를 조회했는데 "$APP_APPLE_ID"가 정의돼 있지 않아
        # 조회가 실패하고 || echo 0 으로 떨어져 매번 1이 됐다 — 두 번째 빌드부터 TestFlight가
        # "이미 있는 빌드 번호"로 거부한다. 카운터는 늘 정의돼 있고 단조 증가라 이 문제가 없다.
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: IPA 빌드
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
