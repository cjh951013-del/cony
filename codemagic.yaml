# CONY 코니 — Codemagic 클라우드 iOS 빌드 (Windows PC에서 Mac 없이 iOS 앱 만들기)
# 사용법: docs/IOS-BUILD.md 참조. Codemagic 개인 계정 무료 500분/월로 충분 (1회 빌드 약 10~15분).
workflows:
  ios-build:
    name: CONY iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      # Codemagic UI에 등록한 App Store Connect API 키 이름과 한 글자도 다르면 안 된다.
      # 개인 계정은 좌측 Settings(계정 설정) 안의 Integrations에서 등록한다.
      app_store_connect: cony-asc-key
    environment:
      # ★ios_signing 블록은 쓰지 않는다. 그건 "Codemagic에 미리 업로드해둔 프로파일을 가져오는"
      #  수동 서명 방식이라, 프로파일이 없으면
      #  "No matching profiles found for bundle identifier ..." 로 실패한다(첫 빌드가 그랬다).
      #  아래 '코드 서명' 단계에서 --create 로 인증서·프로파일을 없으면 만들어 쓰는 자동 방식을 쓴다.
      #  두 방식을 섞으면 안 된다.
      # Codemagic 환경변수는 그룹에 속해야 저장된다. UI(Environment variables 탭)에서
      # appstore 그룹을 만들고 CERTIFICATE_PRIVATE_KEY 를 Secret 으로 넣어 둔다.
      # 여기서 그룹을 불러오지 않으면 빌드 중에 그 변수가 보이지 않는다.
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.conyami.app"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: 의존성 설치
        script: npm install
      - name: 웹 자산 빌드 (dist/)
        script: npm run web:build
      - name: iOS 플랫폼 생성
        script: npx cap add ios
      - name: 최소 iOS 버전 15.0 적용
        # ★반드시 cap sync(=pod install) 앞에서 돈다. Podfile의 platform 값을 Capacitor가
        #  post_install에서 각 Pod 타깃에 밀어 넣으므로, 나중에 고치면 Pods는 13.0으로 남는다.
        #  Capacitor 6 기본값이 13.0이라 그냥 두면 업로드는 되지만 ITMS-90068 경고가 붙고
        #  2027년 봄부터는 업로드 자체가 거부된다(빌드 4에서 실제로 받았다).
        script: npm run ios:setup
      - name: 앱 아이콘·스플래시 생성 (assets/icon.png, splash.png → iOS 전 사이즈)
        # ★ios/ 폴더는 매 빌드마다 새로 만들어지므로, 이 단계가 없으면 Capacitor 기본
        #  플레이스홀더 아이콘이 그대로 앱에 박힌다(애플 심사에서 반려 사유가 된다).
        script: npm run assets:gen
      - name: 웹 자산 동기화
        script: npx cap sync ios
      - name: 빌드 번호 자동 증가
        # ★서명보다 먼저 돌린다. agvtool은 project.pbxproj를 다시 쓰기 때문에, 서명 설정을
        #  먼저 넣어두면 이 단계가 덮어써 "requires a provisioning profile"로 실패한다(실제로 그랬다).
        #  Codemagic이 워크플로마다 올려주는 $BUILD_NUMBER를 쓴다 — 늘 정의돼 있고 단조 증가라
        #  TestFlight가 "이미 있는 빌드 번호"로 거부하는 일이 없다.
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
          # agvtool이 pbxproj를 통째로 다시 쓴다. 최소 버전이 살아남았는지 여기서 확인한다.
          if grep -qE "IPHONEOS_DEPLOYMENT_TARGET = (1[0-4]|[0-9])\.[0-9]+;" App.xcodeproj/project.pbxproj; then
            echo "최소 iOS 버전이 15.0 미만으로 되돌아갔습니다"
            grep -n "IPHONEOS_DEPLOYMENT_TARGET" App.xcodeproj/project.pbxproj
            exit 1
          fi
      - name: 코드 서명 (인증서·프로파일 생성 후 프로젝트에 적용)
        # --create 가 핵심. App ID를 갓 만들면 배포 인증서도 프로비저닝 프로파일도 없는데,
        # 이 플래그가 App Store Connect API로 둘 다 만들어 준다.
        # 프로젝트 파일을 건드리는 마지막 단계여야 하므로 아카이브 직전에 둔다.
        # ★--certificate-key 가 반드시 필요하다. 인증서는 개인키와 한 쌍인데, 빌드 머신은 매번
        #  새로 만들어져 개인키가 남지 않는다. 키 없이 --create 하면 애플에 인증서만 만들어지고
        #  다음 빌드에서 "Cannot save Signing Certificates without certificate private key" 로 막힌다.
        #  고정된 키를 Codemagic 환경변수 CERTIFICATE_PRIVATE_KEY(secure)로 넣어 두고 계속 쓴다.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "ios/App/App.xcodeproj"
          # 실제로 써졌는지 확인. 여기서 잡아야 32초짜리 아카이브를 돌린 뒤에 알게 되지 않는다.
          if ! grep -q "PROVISIONING_PROFILE_SPECIFIER" ios/App/App.xcodeproj/project.pbxproj; then
            echo "서명 설정이 프로젝트에 적용되지 않았습니다 (PROVISIONING_PROFILE_SPECIFIER 없음)"
            exit 1
          fi
          echo "서명 적용 확인:"
          grep -oE "PROVISIONING_PROFILE_SPECIFIER = [^;]*;|DEVELOPMENT_TEAM = [^;]*;|CODE_SIGN_STYLE = [^;]*;" ios/App/App.xcodeproj/project.pbxproj | sort -u
      - name: IPA 빌드
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # ★submit_to_testflight 는 '외부 테스터 베타 심사 제출'까지 간다. 거기엔 연락처
        #  (Feedback Email, 심사 담당자 이름·전화·이메일)가 필수라, 안 채워두면 빌드가
        #  업로드까지 다 끝난 뒤 마지막에 post-processing failed 로 빨갛게 끝난다
        #  (빌드 5가 그랬다 — IPA 는 멀쩡히 올라갔는데 이 단계만 실패).
        #  내부 테스터는 베타 심사가 없고, 그룹에 '자동 배포'를 켜두면 App Store Connect
        #  가 처리 완료 즉시 알아서 나눠준다. 그래서 false 로 둔다.
        #  나중에 외부 테스터를 공개 모집할 때 test-info 를 채우고 true 로 바꾼다:
        #  https://appstoreconnect.apple.com/apps/6797927244/testflight/test-info
        submit_to_testflight: false
